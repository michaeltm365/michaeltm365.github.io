<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 0: Becoming Friends with Your Camera</title>
<style>
    :root {
        --bg: #f7f5f2;
        --panel: #ffffff;
        --ink: #1c1b19;
        --muted: #6b6864;
        --rule: #e2ded8;
        --accent: #b4451f;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0 24px 96px;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.65 "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        -webkit-font-smoothing: antialiased;
    }

    header, main { max-width: 900px; margin: 0 auto; }

    header {
        padding: 72px 0 40px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 56px;
    }

    .eyebrow {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 14px;
    }

    h1 {
        font-size: clamp(32px, 6vw, 52px);
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -.02em;
        margin: 0;
    }

    .back {
        display: inline-block;
        margin-top: 28px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 2px;
    }
    .back:hover { color: var(--accent); border-color: var(--accent); }

    section { margin-bottom: 72px; }

    h2 {
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -.01em;
        margin: 0;
    }

    h2 .num {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 14px;
        color: var(--accent);
        margin-right: 12px;
        vertical-align: 3px;
    }

    .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-top: 28px;
    }

    figure {
        margin: 0;
        background: var(--panel);
        padding: 12px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }

    figure img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 5px;
        background: #eceae6;
    }

    .solo { max-width: 620px; margin: 28px auto 0; }

    @media (max-width: 640px) {
        .pair { grid-template-columns: 1fr; }
        header { padding-top: 48px; }
    }
</style>
</head>
<body>

<header>
    <p class="eyebrow">CS 180 &middot; Project 0</p>
    <h1>Becoming Friends<br>with Your Camera</h1>
    <a class="back" href="../index.html">&larr; back to portfolio</a>
</header>

<main>

<section>
    <h2><span class="num">01</span>Selfie: The Wrong Way vs. The Right Way</h2>
    <div class="pair">
        <figure><img src="media/IMG_0128.jpg" alt="Close-up selfie taken at arm's length with a wide lens"></figure>
        <figure><img src="media/IMG_0129.jpg" alt="Portrait taken from several feet back with the telephoto lens"></figure>
    </div>
</section>

<section>
    <h2><span class="num">02</span>Architectural Perspective Compression</h2>
    <div class="pair">
        <figure><img src="media/IMG_0139.jpg" alt="Building facade photographed from far away with the lens zoomed in"></figure>
        <figure><img src="media/IMG_0137.jpg" alt="Building facade photographed from close up with a wide lens"></figure>
    </div>
</section>

<section>
    <h2><span class="num">03</span>The Dolly Zoom</h2>
    <figure class="solo"><img src="media/ezgif-83314c923833de56.gif" alt="Animated dolly zoom: the basketball stays the same size while the background expands"></figure>
</section>

</main>

</body>
</html>
